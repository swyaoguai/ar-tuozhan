# ar-tuozhan bundle patch.
#
# 插件半身靠这一行挂到 Host 上；name 必须是裸包名。
# 它接管的是 llm-pi-ai 里那个指向托管 host 的路由（ps.air-outer.com /
# agentrouter.org）—— 路由叫什么名字都不影响，别的 provider 一概不碰，
# 所以这里不需要（也不该）再声明 llm-pi-ai 那一条。
- insert:
    - id: ar-tuozhan
      name: 'ar-tuozhan'
      config:
        enabled: true
        url: "https://ps.air-outer.com/v1"
        apiKeyEnv: "AR_API_KEY"
        originator: "codex_cli_rs"
        displayName: "ar"
        autoFailover: true
